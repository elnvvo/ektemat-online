{% extends "base.html" %}
{% block title %}Logg inn · Ekte Mat{% endblock %}
{% block content %}
  <h1>Logg inn</h1>
  <form class="form" method="post" action="{{ url_for('account.login') }}" novalidate>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label for="email">E-post</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
    <label for="password">Passord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Logg inn</button>
  </form>
  <p>Har du ikke konto? <a href="{{ url_for('account.register') }}">Registrer deg</a></p>
{% endblock %}
